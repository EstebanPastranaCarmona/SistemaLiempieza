{% extends "base.html" %}
{% block title %}Reportes{% endblock %}

{% block body %}

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4 class="mb-1"><i class="bi bi-bar-chart-fill me-2"></i>Reportes</h4>
        <small class="opacity-75">Selecciona el módulo sobre el que deseas generar un reporte</small>
    </div>
    <a href="{% url 'users:dashboard' %}" class="btn-lc-outline">
        <i class="bi bi-arrow-left me-1"></i>Dashboard
    </a>
</div>

<div class="row g-4 mt-1">

    <div class="col-12 col-md-6">
        <a href="{% url 'reports:inventory' %}" class="text-decoration-none">
            <div class="dashboard-card p-4 h-100">
                <div class="d-flex align-items-center">
                    <div class="card-icon me-3">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <div>
                        <h5 class="mb-1">Inventario</h5>
                        <small class="opacity-75">Stock actual, lotes, vencimientos y movimientos</small>
                    </div>
                </div>
            </div>
        </a>
    </div>

    <div class="col-12 col-md-6">
        <a href="{% url 'reports:tasks' %}" class="text-decoration-none">
            <div class="dashboard-card p-4 h-100">
                <div class="d-flex align-items-center">
                    <div class="card-icon me-3">
                        <i class="bi bi-clipboard-check"></i>
                    </div>
                    <div>
                        <h5 class="mb-1">Tareas</h5>
                        <small class="opacity-75">Listado general, tareas vencidas y resumen por cliente</small>
                    </div>
                </div>
            </div>
        </a>
    </div>

</div>

{% endblock %}
