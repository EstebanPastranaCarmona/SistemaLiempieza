{% extends "base.html" %}
{% block title %}Subir evidencia{% endblock %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <nav class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'users:dashboard' %}" class="text-decoration-none"><i class="bi bi-house-fill"></i></a></li>
                <li class="breadcrumb-item"><a href="{% url 'tasks:task_list' %}" class="text-decoration-none">Tareas</a></li>
                <li class="breadcrumb-item"><a href="{% url 'tasks:task_detail' task.pk %}" class="text-decoration-none">{{ task.title }}</a></li>
                <li class="breadcrumb-item active">Evidencia</li>
            </ol>
        </nav>
        <div class="card form-card">
            <div class="card-header d-flex align-items-center gap-2">
                <i class="bi bi-upload fs-5"></i>
                <span class="fw-semibold">Subir evidencia</span>
            </div>
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-image me-1"></i>Imagen o video <span class="opacity-75 fw-normal">(opcional)</span></label>
                        {{ form.file }}
                        <div class="form-text opacity-75">Formatos aceptados: imágenes (JPG, PNG, etc.) y videos (MP4, MOV, etc.)</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label"><i class="bi bi-chat-left-text me-1"></i>Nota</label>
                        {{ form.note }}
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-lc">
                            <i class="bi bi-upload me-1"></i>Subir evidencia
                        </button>
                        <a href="{% url 'tasks:task_detail' task.pk %}" class="btn-lc-outline">
                            <i class="bi bi-x-lg me-1"></i>Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
