{% extends "base.html" %}
{% block title %}Completar Tarea{% endblock %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6">

        <nav class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'users:dashboard' %}" class="text-decoration-none"><i class="bi bi-house-fill"></i></a></li>
                <li class="breadcrumb-item"><a href="{% url 'tasks:task_list' %}" class="text-decoration-none">Tareas</a></li>
                <li class="breadcrumb-item"><a href="{% url 'tasks:task_detail' task.pk %}" class="text-decoration-none">{{ task.title }}</a></li>
                <li class="breadcrumb-item active">Completar</li>
            </ol>
        </nav>

        <div class="card form-card">
            <div class="card-header d-flex align-items-center gap-2">
                <i class="bi bi-check-circle-fill fs-5 text-success"></i>
                <span class="fw-600">Marcar como completada</span>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-3">¿Confirmás que la tarea <strong>{{ task.title }}</strong> fue completada?</p>
                <form method="POST" novalidate>
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label"><i class="bi bi-chat-left-text me-1"></i>Observaciones finales</label>
                        {{ form.notes }}
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-lc">
                            <i class="bi bi-check-lg me-1"></i>Confirmar completada
                        </button>
                        <a href="{% url 'tasks:task_detail' task.pk %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg me-1"></i>Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
