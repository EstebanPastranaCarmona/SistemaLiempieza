{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock title %}

{% block body %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4">

            <h4 class="card-title text-center mb-4">Sistema Control de Limpieza</h4>

            {% if messages %}
                {% for msg in messages %}
                    <div class="alert alert-danger py-2">{{ msg }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ingresá tu usuario" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="Ingresá tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

        </div>
    </div>
</div>
{% endblock body %}
