[phases.setup]
nixPkgs = ["python311", "pkg-config", "mariadb", "mariadb.dev"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["cd Project && python manage.py collectstatic --no-input"]

[start]
cmd = "cd Project && python manage.py migrate --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
